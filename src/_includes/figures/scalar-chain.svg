<svg class="fig" viewBox="0 0 800 500" role="img" aria-label="Fayol's scalar chain. Two lines of authority run down from A: A, B, C, D, E, F on the left and A, L, M, N, O, P on the right. The formal route from F to P climbs to A and back down, ten steps. A dashed gang plank links F and P directly, used with the knowledge and agreement of their superiors E and O.">
