<svg class="fig" viewBox="0 0 800 500" role="img" aria-label="Walton's eight criteria for quality of work life: 1, fair pay; 2, safe and healthy conditions; 3, using and growing skills; 4, growth and security; 5, social integration; 6, rights at work; 7, work and the rest of life; 8, socially relevant work.">
  <rect class="f-bg" width="800" height="500"/>
<rect class="f-box" x="20" y="22" width="370" height="104" rx="16"/><circle class="f-acc" cx="58" cy="74" r="24" stroke="#0d2a1c" stroke-width="2"/><text x="58" y="83" text-anchor="middle" class="f-text f-strong">1</text><text x="98" y="68" class="f-text f-strong">Fair pay</text><text x="98" y="98" class="f-small">Adequate and fair compensation</text><rect class="f-box" x="20" y="140" width="370" height="104" rx="16"/><circle class="f-acc" cx="58" cy="192" r="24" stroke="#0d2a1c" stroke-width="2"/><text x="58" y="201" text-anchor="middle" class="f-text f-strong">2</text><text x="98" y="186" class="f-text f-strong">Safe, healthy conditions</text><text x="98" y="216" class="f-small">Fair hours, physical safety</text><rect class="f-box" x="20" y="258" width="370" height="104" rx="16"/><circle class="f-acc" cx="58" cy="310" r="24" stroke="#0d2a1c" stroke-width="2"/><text x="58" y="319" text-anchor="middle" class="f-text f-strong">3</text><text x="98" y="304" class="f-text f-strong">Using and growing skills</text><text x="98" y="334" class="f-small">Autonomy, variety, whole tasks</text><rect class="f-box" x="20" y="376" width="370" height="104" rx="16"/><circle class="f-acc" cx="58" cy="428" r="24" stroke="#0d2a1c" stroke-width="2"/><text x="58" y="437" text-anchor="middle" class="f-text f-strong">4</text><text x="98" y="422" class="f-text f-strong">Growth and security</text><text x="98" y="452" class="f-small">Careers, learning, job security</text><rect class="f-box" x="410" y="22" width="370" height="104" rx="16"/><circle class="f-acc" cx="448" cy="74" r="24" stroke="#0d2a1c" stroke-width="2"/><text x="448" y="83" text-anchor="middle" class="f-text f-strong">5</text><text x="488" y="68" class="f-text f-strong">Social integration</text><text x="488" y="98" class="f-small">Belonging, without prejudice</text><rect class="f-box" x="410" y="140" width="370" height="104" rx="16"/><circle class="f-acc" cx="448" cy="192" r="24" stroke="#0d2a1c" stroke-width="2"/><text x="448" y="201" text-anchor="middle" class="f-text f-strong">6</text><text x="488" y="186" class="f-text f-strong">Rights at work</text><text x="488" y="216" class="f-small">Privacy, voice, fair treatment</text><rect class="f-box" x="410" y="258" width="370" height="104" rx="16"/><circle class="f-acc" cx="448" cy="310" r="24" stroke="#0d2a1c" stroke-width="2"/><text x="448" y="319" text-anchor="middle" class="f-text f-strong">7</text><text x="488" y="304" class="f-text f-strong">Work and the rest of life</text><text x="488" y="334" class="f-small">Time and energy left for family</text><rect class="f-box" x="410" y="376" width="370" height="104" rx="16"/><circle class="f-acc" cx="448" cy="428" r="24" stroke="#0d2a1c" stroke-width="2"/><text x="448" y="437" text-anchor="middle" class="f-text f-strong">8</text><text x="488" y="422" class="f-text f-strong">Socially relevant work</text><text x="488" y="452" class="f-small">Pride in what the employer does</text>
</svg>
