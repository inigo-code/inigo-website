<svg class="fig" viewBox="0 0 800 500" role="img" aria-label="The four outcomes of a hypothesis test. If H0 is true and you reject it, that is a Type I error, a false alarm, with probability alpha. If H0 is true and you do not reject it, that is correct, with probability 1 minus alpha. If H0 is false and you reject it, that is correct, with probability 1 minus beta, the power of the test. If H0 is false and you do not reject it, that is a Type II error, a missed effect, with probability beta.">
  <rect class="f-bg" width="800" height="500"/>
<text x="395" y="46" text-anchor="middle" class="f-small f-strong">The truth about H₀</text><text x="382" y="92" text-anchor="middle" class="f-text f-strong">H₀ is true</text><text x="657" y="92" text-anchor="middle" class="f-text f-strong">H₀ is false</text><text x="30" y="92" class="f-small f-strong">Your decision</text><text x="30" y="205" class="f-text f-strong">Reject H₀</text><text x="30" y="233" class="f-small">the result is</text><text x="30" y="257" class="f-small">“significant”</text><text x="30" y="385" class="f-text f-strong">Do not</text><text x="30" y="413" class="f-text f-strong">reject H₀</text><rect class="f-acc" x="250" y="120" width="265" height="170" rx="14"/><text x="382.5" y="186" text-anchor="middle" class="f-big">Type I error</text><text x="382.5" y="226" text-anchor="middle" class="f-text">a false alarm</text><text x="382.5" y="254" text-anchor="middle" class="f-small">probability α</text><rect class="f-box" x="525" y="120" width="265" height="170" rx="14"/><text x="657.5" y="186" text-anchor="middle" class="f-big">Correct</text><text x="657.5" y="226" text-anchor="middle" class="f-text">a real effect found</text><text x="657.5" y="254" text-anchor="middle" class="f-small">probability 1 − β (power)</text><rect class="f-box" x="250" y="300" width="265" height="170" rx="14"/><text x="382.5" y="366" text-anchor="middle" class="f-big">Correct</text><text x="382.5" y="406" text-anchor="middle" class="f-text">no effect, none claimed</text><text x="382.5" y="434" text-anchor="middle" class="f-small">probability 1 − α</text><rect class="f-acc" x="525" y="300" width="265" height="170" rx="14"/><text x="657.5" y="366" text-anchor="middle" class="f-big">Type II error</text><text x="657.5" y="406" text-anchor="middle" class="f-text">a missed effect</text><text x="657.5" y="434" text-anchor="middle" class="f-small">probability β</text>
</svg>
