<svg class="fig" viewBox="0 0 800 630" role="img" aria-label="The eleven Incoterms 2020 rules on one chart. For each rule a bar shows how far the seller pays costs and a dot shows where risk passes to the buyer. EXW: both at the seller’s premises. FCA: both when handed to the carrier. CPT and CIP: risk passes when handed to the carrier, but the seller pays carriage to the destination, and under CIP insurance too. DAP: both on arrival at the destination. DPU: both once unloaded there. DDP: risk on arrival, and the seller also pays import duty. FAS: both alongside the ship. FOB: both on board. CFR and CIF: risk passes on board at the port of shipment, but the seller pays freight to the destination port, and under CIF insurance too.">
  <rect class="f-bg" width="800" height="630"/>
<g class="f-grid"><line x1="190" y1="74" x2="190" y2="568"/><line x1="285" y1="74" x2="285" y2="568"/><line x1="380" y1="74" x2="380" y2="568"/><line x1="472" y1="74" x2="472" y2="568"/><line x1="570" y1="74" x2="570" y2="568"/><line x1="660" y1="74" x2="660" y2="568"/><line x1="750" y1="74" x2="750" y2="568"/></g><g class="f-small" style="font-size:16px"><text x="190" y="30" text-anchor="middle" class="f-strong">Seller’s</text><text x="190" y="52" text-anchor="middle">premises</text><text x="285" y="30" text-anchor="middle" class="f-strong">Handed to</text><text x="285" y="52" text-anchor="middle">carrier</text><text x="380" y="30" text-anchor="middle" class="f-strong">Alongside</text><text x="380" y="52" text-anchor="middle">ship</text><text x="472" y="30" text-anchor="middle" class="f-strong">On board</text><text x="472" y="52" text-anchor="middle">ship</text><text x="570" y="30" text-anchor="middle" class="f-strong">Arrival at</text><text x="570" y="52" text-anchor="middle">destination</text><text x="660" y="30" text-anchor="middle" class="f-strong">Unloaded</text><text x="660" y="52" text-anchor="middle">there</text><text x="750" y="30" text-anchor="middle" class="f-strong">Import</text><text x="750" y="52" text-anchor="middle">duty paid</text></g><text x="30" y="92" class="f-small f-strong">Any mode of transport</text><text x="30" y="128" class="f-text f-strong">EXW</text><rect class="f-acc" x="168" y="112" width="32" height="16" rx="8"/><circle class="f-dot" cx="190" cy="120" r="9"/><text x="30" y="166" class="f-text f-strong">FCA</text><rect class="f-acc" x="168" y="150" width="127" height="16" rx="8"/><circle class="f-dot" cx="285" cy="158" r="9"/><text x="30" y="204" class="f-text f-strong">CPT</text><rect class="f-acc" x="168" y="188" width="412" height="16" rx="8"/><circle class="f-dot" cx="285" cy="196" r="9"/><text x="30" y="242" class="f-text f-strong">CIP</text><rect class="f-acc" x="168" y="226" width="412" height="16" rx="8"/><text x="590" y="240" class="f-small" style="font-size:16px">+ insurance</text><circle class="f-dot" cx="285" cy="234" r="9"/><text x="30" y="280" class="f-text f-strong">DAP</text><rect class="f-acc" x="168" y="264" width="412" height="16" rx="8"/><circle class="f-dot" cx="570" cy="272" r="9"/><text x="30" y="318" class="f-text f-strong">DPU</text><rect class="f-acc" x="168" y="302" width="502" height="16" rx="8"/><circle class="f-dot" cx="660" cy="310" r="9"/><text x="30" y="356" class="f-text f-strong">DDP</text><rect class="f-acc" x="168" y="340" width="412" height="16" rx="8"/><rect class="f-acc" x="726" y="340" width="48" height="16" rx="8"/><circle class="f-dot" cx="570" cy="348" r="9"/><line x1="24" y1="376" x2="776" y2="376" stroke="#e3dac2" stroke-width="2"/><text x="30" y="410" class="f-small f-strong">Sea and inland waterway only</text><text x="30" y="446" class="f-text f-strong">FAS</text><rect class="f-acc" x="168" y="430" width="222" height="16" rx="8"/><circle class="f-dot" cx="380" cy="438" r="9"/><text x="30" y="484" class="f-text f-strong">FOB</text><rect class="f-acc" x="168" y="468" width="314" height="16" rx="8"/><circle class="f-dot" cx="472" cy="476" r="9"/><text x="30" y="522" class="f-text f-strong">CFR</text><rect class="f-acc" x="168" y="506" width="412" height="16" rx="8"/><circle class="f-dot" cx="472" cy="514" r="9"/><text x="30" y="560" class="f-text f-strong">CIF</text><rect class="f-acc" x="168" y="544" width="412" height="16" rx="8"/><text x="590" y="558" class="f-small" style="font-size:16px">+ insurance</text><circle class="f-dot" cx="472" cy="552" r="9"/><rect class="f-acc" x="30" y="594" width="40" height="16" rx="8"/><text x="82" y="608" class="f-small">Costs the seller pays</text><circle class="f-dot" cx="372" cy="602" r="9"/><text x="390" y="608" class="f-small">Risk passes to the buyer</text>
</svg>
