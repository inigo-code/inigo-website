<svg class="fig" viewBox="0 0 800 500" role="img" aria-label="A four-step loop for learning with an AI assistant: 1, attempt it first, with your own outline and answer; 2, ask a sharp question, giving context and asking for reasons; 3, check every claim against a trusted source; 4, rewrite in your own words and note where AI helped. In the middle: you stay the author.">
  <rect class="f-bg" width="800" height="500"/>
<defs><marker id="ai-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d2a1c"/></marker></defs><rect class="f-acc" x="260" y="46" width="280" height="88" rx="16" stroke="#0d2a1c" stroke-width="2"/><text x="400" y="84" text-anchor="middle" class="f-text f-strong">1  Attempt it first</text><text x="400" y="112" text-anchor="middle" class="f-small">your outline, your answer</text><rect class="f-box" x="500" y="206" width="280" height="88" rx="16"/><text x="640" y="244" text-anchor="middle" class="f-text f-strong">2  Ask a sharp question</text><text x="640" y="272" text-anchor="middle" class="f-small">context in, reasons out</text><rect class="f-box" x="260" y="366" width="280" height="88" rx="16"/><text x="400" y="404" text-anchor="middle" class="f-text f-strong">3  Check every claim</text><text x="400" y="432" text-anchor="middle" class="f-small">against a trusted source</text><rect class="f-box" x="20" y="206" width="280" height="88" rx="16"/><text x="160" y="244" text-anchor="middle" class="f-text f-strong">4  Rewrite in your words</text><text x="160" y="272" text-anchor="middle" class="f-small">and note where AI helped</text><path class="f-line" d="M548 90 Q640 90 640 196" fill="none" marker-end="url(#ai-arrow)"/><path class="f-line" d="M640 302 Q640 410 548 410" fill="none" marker-end="url(#ai-arrow)"/><path class="f-line" d="M252 410 Q160 410 160 302" fill="none" marker-end="url(#ai-arrow)"/><path class="f-line" d="M160 196 Q160 90 252 90" fill="none" marker-end="url(#ai-arrow)"/><text x="400" y="242" text-anchor="middle" class="f-big">You stay</text><text x="400" y="280" text-anchor="middle" class="f-big">the author</text>
</svg>
