<svg class="fig" viewBox="0 0 800 500" role="img" aria-label="Break-even chart for the worked example, drawn to scale. Fixed cost is 2 lakh rupees. The total cost line starts at 2 lakh and rises 300 rupees a bag; the sales revenue line starts at zero and rises 500 rupees a bag. They cross at the break-even point, 1,000 bags and 5 lakh rupees. Below it is a loss, above it a profit. At actual sales of 1,500 bags the margin of safety is 500 bags.">
  <rect class="f-bg" width="800" height="500"/>
  <polygon class="f-l1" points="110,430 430,245 110,356"/>
  <polygon class="f-acc" points="430,245 750,60 750,134"/>
  <g class="f-grid"><line x1="110" y1="337.5" x2="760" y2="337.5"/><line x1="110" y1="245" x2="760" y2="245"/><line x1="110" y1="152.5" x2="760" y2="152.5"/><line x1="110" y1="60" x2="760" y2="60"/></g>
  <line class="f-axis" x1="110" y1="430" x2="765" y2="430"/><line class="f-axis" x1="110" y1="430" x2="110" y2="50"/>
  <line class="f-dash" x1="110" y1="356" x2="750" y2="356"/>
  <line class="f-line" x1="110" y1="430" x2="750" y2="60"/>
  <line class="f-line" x1="110" y1="356" x2="750" y2="134"/>
  <line class="f-dash" x1="430" y1="245" x2="430" y2="430"/><line class="f-dash" x1="590" y1="152.5" x2="590" y2="430"/>
  <circle class="f-dot" cx="430" cy="245" r="9"/>
  <path class="f-line" d="M430 405 v12 M430 411 H590 M590 405 v12" fill="none" stroke-width="2.5"/>
  <g class="f-small"><text x="110" y="456" text-anchor="middle">0</text><text x="270" y="456" text-anchor="middle">500</text><text x="430" y="456" text-anchor="middle">1,000</text><text x="590" y="456" text-anchor="middle">1,500</text><text x="750" y="456" text-anchor="middle">2,000</text><text x="98" y="343.5" text-anchor="end">2.5</text><text x="98" y="251" text-anchor="end">5</text><text x="98" y="158.5" text-anchor="end">7.5</text><text x="98" y="66" text-anchor="end">10</text><text x="122" y="44">₹ lakh</text><text x="760" y="490" text-anchor="end">Bags sold a month</text><text x="510" y="380" text-anchor="middle" class="f-strong">Margin of safety</text><text x="510" y="401" text-anchor="middle">500 bags</text><text x="612" y="346">Fixed cost</text></g>
  <g class="f-text"><text x="650" y="80" text-anchor="end">Sales revenue</text><text x="750" y="200" text-anchor="end">Total cost</text><text x="740" y="118" text-anchor="end" class="f-strong">Profit</text><text x="174" y="378" text-anchor="middle">Loss</text><text x="412" y="205" text-anchor="end" class="f-strong">Break-even point</text><text x="412" y="231" text-anchor="end">1,000 bags, ₹5 lakh</text></g>
</svg>
