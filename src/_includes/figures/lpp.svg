<svg class="fig" viewBox="0 0 800 500" role="img" aria-label="Graph of the worked example. The lines 4x + 2y = 60 and 2x + 3y = 54 bound a shaded feasible region with corners (0, 0), (15, 0), (9, 12) and (0, 18). The profit line Z = 500x + 300y touches it last at (9, 12), where Z is 8,100 rupees.">
  <rect class="f-bg" width="800" height="500"/>
  <polygon class="f-acc" points="90,440 450,440 306,290 90,215"/>
  <g class="f-grid">
    <line x1="90" y1="315" x2="760" y2="315"/><line x1="90" y1="190" x2="760" y2="190"/><line x1="90" y1="65" x2="760" y2="65"/>
    <line x1="210" y1="440" x2="210" y2="60"/><line x1="330" y1="440" x2="330" y2="60"/><line x1="450" y1="440" x2="450" y2="60"/><line x1="570" y1="440" x2="570" y2="60"/><line x1="690" y1="440" x2="690" y2="60"/>
  </g>
  <line class="f-axis" x1="90" y1="440" x2="765" y2="440"/><line class="f-axis" x1="90" y1="440" x2="90" y2="55"/>
  <line class="f-line" x1="90" y1="65" x2="450" y2="440"/>
  <line class="f-line" x1="90" y1="215" x2="738" y2="440"/>
  <line class="f-dash" x1="90" y1="102.5" x2="479" y2="440"/>
  <circle class="f-dot" cx="306" cy="290" r="10"/>
  <g class="f-small">
    <text x="90" y="468" text-anchor="middle">0</text><text x="210" y="468" text-anchor="middle">5</text><text x="330" y="468" text-anchor="middle">10</text><text x="450" y="468" text-anchor="middle">15</text><text x="570" y="468" text-anchor="middle">20</text><text x="690" y="468" text-anchor="middle">25</text>
    <text x="76" y="321" text-anchor="end">10</text><text x="76" y="196" text-anchor="end">20</text><text x="76" y="71" text-anchor="end">30</text>
    <text x="764" y="496" text-anchor="end">Tables, x</text>
    <text x="100" y="40">Chairs, y</text>
  </g>
  <g class="f-text">
    <text x="184" y="120">4x + 2y = 60</text>
    <text x="600" y="368">2x + 3y = 54</text>
    <text x="330" y="276" class="f-strong">Optimum (9, 12)</text>
    <text x="330" y="250">Z = ₹8,100</text>
  </g>
  <line class="f-dash" x1="480" y1="132" x2="530" y2="132"/>
  <text class="f-small" x="544" y="139">Z = 500x + 300y</text>
</svg>
