  </g>
  <g class="f-text f-on-acc" text-anchor="middle">
    <text x="650" y="102">Self-awareness</text><text x="650" y="188">Self-regulation</text><text x="650" y="274">Motivation</text><text x="650" y="360">Empathy</text><text x="650" y="446">Social skill</text>
  </g>
</svg>
