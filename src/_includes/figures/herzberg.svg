<svg class="fig" viewBox="0 0 800 500" role="img" aria-label="Herzberg's two-factor theory as two separate scales. Hygiene factors (pay, supervision, company policy, working conditions, job security, relations with co-workers) run from dissatisfaction to no dissatisfaction. Motivators (achievement, recognition, the work itself, responsibility, advancement, growth) run from no satisfaction to satisfaction.">
  <rect class="f-bg" width="800" height="500"/>
  <defs><marker id="hz-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d2a1c"/></marker></defs>
  <text x="40" y="50" class="f-text f-strong">Hygiene factors</text><text x="241.5" y="50" class="f-small">surround the job</text><line class="f-line" x1="44" y1="86" x2="756" y2="86" marker-start="url(#hz-arrow)" marker-end="url(#hz-arrow)"/><text x="40" y="118" class="f-small">Dissatisfaction</text><text x="760" y="118" text-anchor="end" class="f-small">No dissatisfaction</text><rect class="f-box" x="40" y="140" width="230" height="38" rx="19"/><text x="155" y="166" text-anchor="middle" class="f-small f-strong">Pay</text><rect class="f-box" x="285" y="140" width="230" height="38" rx="19"/><text x="400" y="166" text-anchor="middle" class="f-small f-strong">Supervision</text><rect class="f-box" x="530" y="140" width="230" height="38" rx="19"/><text x="645" y="166" text-anchor="middle" class="f-small f-strong">Company policy</text><rect class="f-box" x="40" y="188" width="230" height="38" rx="19"/><text x="155" y="214" text-anchor="middle" class="f-small f-strong">Working conditions</text><rect class="f-box" x="285" y="188" width="230" height="38" rx="19"/><text x="400" y="214" text-anchor="middle" class="f-small f-strong">Job security</text><rect class="f-box" x="530" y="188" width="230" height="38" rx="19"/><text x="645" y="214" text-anchor="middle" class="f-small f-strong">Co-worker relations</text>
  <line x1="40" y1="250" x2="760" y2="250" stroke="#e3dac2" stroke-width="2"/>
  <text x="40" y="292" class="f-text f-strong">Motivators</text><text x="179" y="292" class="f-small">are in the job itself</text><line class="f-line" x1="44" y1="328" x2="756" y2="328" marker-start="url(#hz-arrow)" marker-end="url(#hz-arrow)"/><text x="40" y="360" class="f-small">No satisfaction</text><text x="760" y="360" text-anchor="end" class="f-small">Satisfaction</text><rect class="f-acc" x="40" y="382" width="230" height="38" rx="19"/><text x="155" y="408" text-anchor="middle" class="f-small f-strong">Achievement</text><rect class="f-acc" x="285" y="382" width="230" height="38" rx="19"/><text x="400" y="408" text-anchor="middle" class="f-small f-strong">Recognition</text><rect class="f-acc" x="530" y="382" width="230" height="38" rx="19"/><text x="645" y="408" text-anchor="middle" class="f-small f-strong">The work itself</text><rect class="f-acc" x="40" y="430" width="230" height="38" rx="19"/><text x="155" y="456" text-anchor="middle" class="f-small f-strong">Responsibility</text><rect class="f-acc" x="285" y="430" width="230" height="38" rx="19"/><text x="400" y="456" text-anchor="middle" class="f-small f-strong">Advancement</text><rect class="f-acc" x="530" y="430" width="230" height="38" rx="19"/><text x="645" y="456" text-anchor="middle" class="f-small f-strong">Growth</text>
</svg>
