<svg class="fig" viewBox="0 0 800 500" role="img" aria-label="Project network for the worked example. Six activities run between five events: A (3 days) from event 1 to 2, B (4) from 1 to 3, C (2) from 2 to 3, D (5) from 2 to 4, E (4) from 3 to 4 and F (3) from 4 to 5. Earliest and latest event times are 0, 3, 5, 9 and 12. The critical path A, C, E, F is highlighted and takes 12 days.">
  <rect class="f-bg" width="800" height="500"/>
  <defs><marker id="cpm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d2a1c"/></marker></defs>
  <line x1="129.2" y1="225.7" x2="247.5" y2="141.6" stroke="#f6e016" stroke-width="16" stroke-linecap="round"/><line x1="309.2" y1="149.3" x2="413.5" y2="297.4" stroke="#f6e016" stroke-width="16" stroke-linecap="round"/><line x1="467" y1="302.8" x2="565.5" y2="185.3" stroke="#f6e016" stroke-width="16" stroke-linecap="round"/><line x1="619.6" y1="184" x2="698.1" y2="292.7" stroke="#f6e016" stroke-width="16" stroke-linecap="round"/>
  <line class="f-line" x1="129.2" y1="225.7" x2="247.5" y2="141.6" marker-end="url(#cpm-arrow)"/><line class="f-line" x1="135.8" y1="260" x2="395.3" y2="324" marker-end="url(#cpm-arrow)"/><line class="f-line" x1="309.2" y1="149.3" x2="413.5" y2="297.4" marker-end="url(#cpm-arrow)"/><line class="f-line" x1="326.7" y1="119.7" x2="549.3" y2="144.8" marker-end="url(#cpm-arrow)"/><line class="f-line" x1="467" y1="302.8" x2="565.5" y2="185.3" marker-end="url(#cpm-arrow)"/><line class="f-line" x1="619.6" y1="184" x2="698.1" y2="292.7" marker-end="url(#cpm-arrow)"/>
  <g class="f-text"><text x="172.6" y="166" text-anchor="middle" class="f-strong">A (3)</text><text x="260.3" y="329.6" text-anchor="middle" class="f-strong">B (4)</text><text x="338" y="250.3" text-anchor="middle" class="f-strong">C (2)</text><text x="443.4" y="110.7" text-anchor="middle" class="f-strong">D (5)</text><text x="540.5" y="269.8" text-anchor="middle" class="f-strong">E (4)</text><text x="635.7" y="265.6" text-anchor="middle" class="f-strong">F (3)</text></g>
