  <g class="f-small"><text x="40" y="448">Inside each event: earliest | latest time (days)</text></g>
  <rect class="f-acc" x="40" y="466" width="34" height="14" rx="7"/><text x="86" y="479" class="f-text f-strong">Critical path A → C → E → F: 12 days</text>
