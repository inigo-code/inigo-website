# Builds the site and publishes it to GitHub Pages every time main is pushed.
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.payload }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The OR Lab maths is checked before anything is published.
      - run: npm test
      - run: npm run build
      # Compare the new pages with the live site, so only new or changed pages are reported to IndexNow.
      - id: indexnow
        run: echo "payload=$(node scripts/indexnow.mjs payload)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing and the other IndexNow search engines which pages changed. Never fails the deploy.
      - name: Report changed pages to IndexNow
        if: needs.build.outputs.indexnow != ''
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data "$PAYLOAD" || echo failed)
          echo "IndexNow answered: $code"
